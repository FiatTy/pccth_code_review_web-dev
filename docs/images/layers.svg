<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Inter, 'IBM Plex Sans Thai', 'Segoe UI', 'Noto Sans Thai', Tahoma, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">ชั้นของโค้ดและทิศทางการ import</title>
  <desc id="desc">โค้ดแบ่งเป็นสี่ชั้น จากล่างขึ้นบนคือ shared, features, pages, app โดย import ไหลขึ้นทางเดียว</desc>

  <defs>
    <marker id="arrowUp" viewBox="0 0 12 12" refX="6" refY="6" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#55606f"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="459" rx="12" fill="#ffffff" stroke="#e3e7ec"/>

  <text x="28" y="30" font-size="10" font-weight="600" letter-spacing="1.8" fill="#8b95a3">LAYERS</text>
  <text x="872" y="30" text-anchor="end" font-size="10.5" fill="#8b95a3" style="font-variant-numeric:tabular-nums">16,875 บรรทัด &#183; 27 หน้า &#183; 10 features</text>

  <line x1="66" y1="392" x2="66" y2="58" stroke="#55606f" stroke-width="1.4" marker-end="url(#arrowUp)"/>
  <text x="40" y="225" font-size="10.5" fill="#55606f" text-anchor="middle" transform="rotate(-90 40 225)">import ไหลขึ้นทางเดียว</text>

  <rect x="84" y="52" width="788" height="78" rx="8" fill="#faf6ef" stroke="#b08d57" stroke-opacity="0.45"/>
  <text x="104" y="82" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#8a6d3f">app/</text>
  <text x="104" y="104" font-size="11.5" fill="#55606f">ที่เดียวที่ต่อหลาย feature เข้าด้วยกันได้</text>
  <text x="430" y="83" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#0e1620" opacity="0.8">main.tsx   App.tsx   router.tsx</text>
  <text x="430" y="102" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#0e1620" opacity="0.55">guards/  layouts/  providers/  realtime/  shell/</text>
  <text x="852" y="81" text-anchor="end" font-size="13" font-weight="600" fill="#0e1620" style="font-variant-numeric:tabular-nums">1,368</text>
  <text x="852" y="99" text-anchor="end" font-size="9.5" fill="#8b95a3">บรรทัด</text>

  <rect x="84" y="142" width="788" height="78" rx="8" fill="#eef4fe" stroke="#1570ef" stroke-opacity="0.4"/>
  <text x="104" y="172" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#1257ba">pages/</text>
  <text x="104" y="194" font-size="11.5" fill="#55606f">จัดวาง + เรียก hook เท่านั้น ห้ามมีสูตรคำนวณ</text>
  <text x="430" y="173" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#0e1620" opacity="0.8">XxxPage.tsx</text>
  <text x="430" y="192" font-size="10.5" fill="#0e1620" opacity="0.55">1 route = 1 ไฟล์ ประกอบจาก features อย่างเดียว</text>
  <text x="852" y="171" text-anchor="end" font-size="13" font-weight="600" fill="#0e1620" style="font-variant-numeric:tabular-nums">6,990</text>
  <text x="852" y="189" text-anchor="end" font-size="9.5" fill="#8b95a3">บรรทัด</text>

  <rect x="84" y="232" width="788" height="78" rx="8" fill="#e9f7f4" stroke="#0d9488" stroke-opacity="0.45"/>
  <text x="104" y="262" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#0b7a70">features/</text>
  <text x="104" y="284" font-size="11.5" fill="#55606f">1 โฟลเดอร์ = 1 เรื่อง เก็บครบจบในตัว</text>
  <text x="430" y="263" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#0e1620" opacity="0.8">analytics  auth  issue  notification  report</text>
  <text x="430" y="282" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#0e1620" opacity="0.8">repository  scan  security  setting  user</text>
  <text x="852" y="261" text-anchor="end" font-size="13" font-weight="600" fill="#0e1620" style="font-variant-numeric:tabular-nums">5,808</text>
  <text x="852" y="279" text-anchor="end" font-size="9.5" fill="#8b95a3">บรรทัด</text>

  <rect x="84" y="322" width="788" height="78" rx="8" fill="#f4f6f8" stroke="#64748b" stroke-opacity="0.45"/>
  <text x="104" y="352" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="15" font-weight="600" fill="#4a5766">shared</text>
  <text x="104" y="374" font-size="11.5" fill="#55606f">ของกลาง ไม่รู้จักธุรกิจของเรา</text>
  <text x="430" y="353" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#0e1620" opacity="0.8">components/ui   components/common   components/charts</text>
  <text x="430" y="372" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10.5" fill="#0e1620" opacity="0.55">lib/   types/   config/</text>
  <text x="852" y="351" text-anchor="end" font-size="13" font-weight="600" fill="#0e1620" style="font-variant-numeric:tabular-nums">2,705</text>
  <text x="852" y="369" text-anchor="end" font-size="9.5" fill="#8b95a3">บรรทัด</text>

  <text x="84" y="429" font-size="11" fill="#55606f">ชั้นล่างห้ามรู้จักชั้นบน &#183; feature ห้ามเรียกกันเอง ยกเว้น <tspan font-family="ui-monospace, Consolas, monospace" fill="#0e1620">import type</tspan> &#183; ESLint บังคับจริง ผิดแล้ว <tspan font-family="ui-monospace, Consolas, monospace" fill="#b42318">npm run lint</tspan> จะ error</text>
</svg>
