  <text x="100" y="456" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/technical-debt</text>

  <rect x="272" y="382" width="172" height="100" rx="7" fill="#ffffff" stroke="#1570ef" stroke-opacity="0.35"/>
  <text x="284" y="404" font-size="10.5" font-weight="600" fill="#1257ba">report</text>
