  <text x="652" y="292" font-size="10.5" font-weight="600" fill="#1257ba">issue</text>
  <text x="652" y="312" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/issue</text>
  <text x="652" y="328" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/issuedetail/:id</text>
  <text x="652" y="344" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/assignment</text>

  <rect x="88" y="382" width="172" height="100" rx="7" fill="#ffffff" stroke="#1570ef" stroke-opacity="0.35"/>
  <text x="100" y="404" font-size="10.5" font-weight="600" fill="#1257ba">analysis</text>
