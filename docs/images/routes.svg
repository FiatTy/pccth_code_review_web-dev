  <text x="284" y="440" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/reporthistory</text>

  <rect x="456" y="382" width="172" height="100" rx="7" fill="#ffffff" stroke="#1570ef" stroke-opacity="0.35"/>
  <text x="468" y="404" font-size="10.5" font-weight="600" fill="#1257ba">setting</text>
  <text x="468" y="424" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/sonarqubeconfig</text>
  <text x="468" y="440" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/notificationsetting</text>
  <text x="468" y="456" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/components</text>

  <rect x="640" y="382" width="172" height="100" rx="7" fill="#fdf3f2" stroke="#d92d20" stroke-opacity="0.45"/>
  <text x="652" y="404" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#b42318">RoleRoute ADMIN</text>
  <text x="652" y="422" font-size="9.5" fill="#55606f">role อื่นเข้าไม่ได้</text>
  <text x="652" y="446" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/usermanagement</text>

  <text x="28" y="562" font-size="11" fill="#55606f">ทุกหน้าโหลดแบบ lazy แยก chunk ให้อัตโนมัติ &#8212; เพิ่ม route ใหม่ใช้ helper <tspan font-family="ui-monospace, Consolas, monospace" fill="#0e1620">lazyRoute()</tspan> ใน <tspan font-family="ui-monospace, Consolas, monospace" fill="#0e1620">app/router.tsx</tspan> และ path ใน <tspan font-family="ui-monospace, Consolas, monospace" fill="#0e1620">import()</tspan> ต้องเป็น string literal</text>
