  <text x="468" y="292" font-size="10.5" font-weight="600" fill="#1257ba">scan</text>
  <text x="468" y="312" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/scanhistory</text>
  <text x="468" y="328" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/scanresult/:id</text>
  <text x="468" y="344" font-family="ui-monospace, 'JetBrains Mono', Consolas, monospace" font-size="9" fill="#0e1620" opacity="0.8">/logviewer/:id</text>

